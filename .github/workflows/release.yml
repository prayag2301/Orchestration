name: Release

# Publishes to PyPI via Trusted Publishing (OIDC). No API token is stored:
# PyPI mints a short-lived credential from this workflow's identity.
# See docs/DISTRIBUTION.md §2.

on:
  release:
    types: [published]
  workflow_dispatch:          # manual runs, for testing the pipeline

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi           # must match the Environment name in the PyPI publisher config
    permissions:
      id-token: write           # required for Trusted Publishing; without it OIDC fails
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

# Packaging skeleton for the `mog` CLI (package: mogestrator).
#
# NOTE: declares the intended build/metadata contract from ADR-0005 and
# docs/DISTRIBUTION.md. The `mog.cli.main` entry point lands in M1 — this file
# is not installable until then.

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mogestrator"                # verify availability on PyPI before first publish
version = "0.0.0"
description = "A context substrate and policy gateway for coding agents: an anchored, self-invalidating code knowledge graph with eviction-and-recall memory, served over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "prayag2301" }]
keywords = ["ai", "agents", "mcp", "claude", "context", "knowledge-graph", "rag", "code-search", "prompt-injection"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Text Processing :: Indexing",
]

# Base install must work offline with local embeddings (ADR-0005).
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "sqlite-vec>=0.1.6",           # Q2: confirm recall at 1e6 vectors
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.2",
  "fastembed>=0.4",              # Q1: local ONNX embeddings, no network on first run
  "platformdirs>=4.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
gateway = ["fastapi>=0.115", "uvicorn>=0.30", "cryptography>=43.0"]
api-embeddings = ["anthropic>=0.40", "openai>=1.40"]
all = ["mogestrator[mcp,gateway,api-embeddings]"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-benchmark>=4.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pyinstaller>=6.10",
]

[project.scripts]
mog = "mog.cli.main:app"

[project.urls]
Homepage = "https://github.com/prayag2301/Mogestrator"
Documentation = "https://github.com/prayag2301/Mogestrator/tree/main/docs"
Issues = "https://github.com/prayag2301/Mogestrator/issues"

# Third-party adapters register here (ARCHITECTURE §3).
[project.entry-points."mog.parsers"]
[project.entry-points."mog.embedders"]
[project.entry-points."mog.retrievers"]
[project.entry-points."mog.policies"]

[tool.hatch.build.targets.wheel]
packages = ["src/mog"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
